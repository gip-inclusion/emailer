[project]
name = "emailer"
version = "0.1.0"
description = "Rendu et envoi d'e-mails (campagnes La Plateforme de l'inclusion) via Brevo"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]>=0.28.1",
    "markdown>=3.10.3",
    "jsonschema>=4.21",
]

[project.scripts]
emailer = "emailer.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["emailer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
